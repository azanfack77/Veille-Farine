name: Supabase - fonction admin-utilisateurs

# Redéploie la fonction Edge à chaque modification de son code sur main.
# Les scripts SQL ne sont JAMAIS exécutés automatiquement : 01_farines_db_supabase.sql
# supprime les tables, il doit rester une action manuelle.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Déployer la fonction
        run: supabase functions deploy admin-utilisateurs --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
