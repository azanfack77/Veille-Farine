name: Console web - vérification

# Vérifie que la console compile avant que Netlify ne la publie.
on:
  push:
    branches: [main]
    paths: ["admin-web/**"]
  pull_request:
    paths: ["admin-web/**"]

jobs:
  compiler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
