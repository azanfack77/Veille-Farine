name: Mobile - construire l'APK

# Se lance à la main (onglet Actions > "Mobile - construire l'APK" > Run workflow)
# ou en publiant une étiquette de version, par exemple v1.0.1.
# La construction se fait sur les serveurs Expo (EAS) ; le lien de l'APK
# apparaît sur expo.dev et dans le journal de cette action.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install
      - name: Vérifier le code
        run: npx tsc --noEmit
      - name: Lancer la construction
        run: eas build --platform android --profile apk --non-interactive --no-wait
